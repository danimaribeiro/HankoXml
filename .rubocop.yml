# Without this, the AllCops/Exclude below *replaces* RuboCop's defaults
# (node_modules, tmp, vendor, .git) rather than adding to them. That silently
# un-excludes vendor/, which is where CI puts every installed gem
# (`bundler-cache: true` sets BUNDLE_PATH=vendor/bundle) -- so RuboCop would
# lint the whole bundle. It passes locally, where gems live outside the repo,
# and fails on every CI job.
inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 3.1
  # RuboCop skips dotted directories by default, so the CI scripts under
  # .github/ were silently unlinted -- `rake` reported a clean tree while that
  # file carried offences nobody saw.
  Include:
    - "**/*.rb"
    - "**/*.gemspec"
    - "**/Rakefile"
    - ".github/**/*.rb"
  Exclude:
    # Cargo's build output. The vendored build (HANKO_XML_VENDOR=1) extracts
    # the libxml2 and xmlsec1 sources in here, and xmlsec1 ships an RPM
    # `xmlsec1.spec` that RuboCop otherwise tries to parse as Ruby.
    - "target/**/*"
    - "tmp/**/*"
    # rake-compiler stages an unpacked copy of lib/ here while building a
    # platform gem. Linting it means linting the same files twice, and makes
    # the inspected count depend on whether a gem happens to have been built.
    - "pkg/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    # A gemspec is one long declaration; splitting it to satisfy a block-length
    # cop would only hide the file allowlist behind an indirection.
    - "*.gemspec"

# The API contract (API_CONTRACT.md §5.2, §5.3) deliberately favours wide
# keyword-argument constructors (C# SignedXml ergonomics) and case-based
# input coercion (§6.2) over builder objects, so the corresponding
# complexity/length/parameter-count cops are relaxed rather than fought.
Metrics/AbcSize:
  Max: 55

Metrics/MethodLength:
  Max: 36

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ParameterLists:
  Max: 15
  CountKeywordArgs: true

Metrics/ClassLength:
  Max: 160

# `ns` is what Nokogiri itself calls the namespaces hash in #xpath/#at_xpath,
# so the public helpers that forward to it use the same name.
Naming/MethodParameterName:
  # RuboCop's defaults, which this key replaces rather than extends, plus `ns`.
  AllowedNames:
    - as
    - at
    - by
    - cc
    - db
    - id
    - if
    - in
    - io
    - ip
    - of
    - on
    - os
    - pp
    - to
    - ns

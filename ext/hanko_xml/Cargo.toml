[package]
name = "hanko_xml"
version = "0.2.0"
edition = "2021"
authors = ["Danimar Ribeiro <danimaribeiro@gmail.com>"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.8.2" }

[build-dependencies]
bindgen = "0.73"
pkg-config = "0.3"
# Verifies the pinned upstream tarballs in dependencies.yml before they are
# extracted. Build-time only, and only exercised on the vendored path.
sha2 = "0.11"

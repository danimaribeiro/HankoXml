name: Cross-compile

# Builds the precompiled platform gems: the vendored libxml2 + xmlsec1 static
# build (HANKO_XML_VENDOR=1) inside rake-compiler-dock, one platform per job.
# Nothing here publishes -- release.yml owns that. This workflow exists to
# prove the cross build works and to hand back installable .gem artifacts.
#
# x86_64-linux, aarch64-linux, arm64-darwin, x64-mingw-ucrt. x86_64-darwin
# stays on the source gem (see the arm64-darwin comment below); x64-mingw32
# (the legacy non-UCRT Windows Ruby) and 32-bit platforms are not planned.
# See VENDORING.md.

on:
  # Pull requests run this through ci.yml, only when the paths that go into a
  # platform gem change. Deliberately not `push`: each build compiles libxml2,
  # xmlsec1 and OpenSSL from source for four Ruby ABIs, and release.yml builds
  # the gems it publishes from scratch anyway.
  workflow_dispatch:
  # Lets release.yml build the platform gems it publishes from this exact
  # matrix, rather than keeping a second copy of it in sync by hand -- same
  # reason main.yml exposes workflow_call.
  workflow_call:

# Read-only GITHUB_TOKEN unless a job asks for more (S-19). When called from
# release.yml, the caller's permissions cap these anyway.
permissions:
  contents: read

# The most expensive workflow here, so cancelling superseded runs matters most.
# A literal group, not ${{ github.workflow }}: when ci.yml or release.yml calls
# this file, github.workflow is the caller's name, and the suites it runs in
# parallel would share one group and cancel each other.
concurrency:
  group: cross-gem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-gem:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Native inside the x86_64 dock container -- no C cross-compilation.
          - x86_64-linux
          # Genuinely cross-compiled. Unblocked once OpenSSL was vendored: its
          # failure was never our build, it was that the container had no
          # OpenSSL for the target.
          - aarch64-linux
          # Cross-compiled from Linux via osxcross in the dock image. Only
          # arm64: x86_64-darwin would need an Intel macos-13 runner to verify
          # honestly, and GitHub is retiring those, so Intel Macs use the
          # source gem.
          - arm64-darwin
          # Cross-compiled from Linux via the mingw-w64 toolchain in the dock
          # image. UCRT, not the legacy msvcrt build -- see VENDORING.md Phase 5.
          - x64-mingw-ucrt

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby & Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cargo-cache: true
          rubygems: latest

      - name: Build the platform gem
        uses: oxidize-rb/actions/cross-gem@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: '3.1,3.2,3.3,3.4'

      # The Windows leg of the symbol-leak check (#20). The smoke test runs
      # nm/otool on Linux and macOS, but windows-latest has no objdump, so the
      # PE export and import tables are read here, on Linux, where binutils
      # understands pei-x86-64.
      - name: Check the DLLs export only the Ruby entry point
        if: matrix.platform == 'x64-mingw-ucrt'
        run: ruby .github/scripts/check_pe_exports.rb pkg/*-x64-mingw-ucrt.gem
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem-${{ matrix.platform }}
          path: pkg/*.gem
          if-no-files-found: error

  # Proves the precompiled gem installs and runs with no libxmlsec1-dev,
  # libxml2-dev, pkg-config, libclang or Rust toolchain present. That is the
  # entire point of shipping it, so it is the real acceptance test.
  smoke-test:
    name: install ${{ matrix.platform }} on a bare container
    needs: cross-gem
    # Each platform on its own architecture. aarch64 was briefly verified under
    # QEMU, which worked, but emulation is not the same machine: OpenSSL probes
    # for NEON and the ARM crypto extensions at runtime, and an emulated CPU can
    # advertise a different feature set than real silicon. For a signing library
    # the code path users actually execute is the one worth testing.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            runner: ubuntu-latest
            arch: x86_64
            docker_platform: linux/amd64
          - platform: aarch64-linux
            runner: ubuntu-24.04-arm
            arch: aarch64
            docker_platform: linux/arm64
          # No macOS container exists, so this one runs directly on the runner
          # with an isolated GEM_HOME. Less hermetic than the Linux legs -- the
          # runner has Homebrew and Xcode -- which is why the script also
          # asserts nothing links libxml2, libxmlsec or libcrypto dynamically.
          # Without that, a gem accidentally linked against the runner's
          # Homebrew would pass here and fail for a user.
          - platform: arm64-darwin
            runner: macos-latest
            arch: arm64
            docker_platform: ""
          # Same reasoning as macOS: no Windows container, runs directly on
          # the runner with an isolated GEM_HOME.
          - platform: x64-mingw-ucrt
            runner: windows-latest
            arch: x86_64
            docker_platform: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem-${{ matrix.platform }}
          path: pkg

      - name: Confirm the runner is the architecture we mean to test on
        shell: bash
        run: |
          echo "runner arch: $(uname -m)"
          if [ "$(uname -m)" != "${{ matrix.arch }}" ]; then
            echo "::error::expected a ${{ matrix.arch }} runner, got $(uname -m) -- the gem would be tested under emulation or not at all"
            exit 1
          fi

      # The platform gem ships one extension per Ruby ABI (3.1-3.4), so the
      # runner's Ruby has to be one of them.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        if: matrix.docker_platform == ''
        with:
          ruby-version: '3.3'

      - name: Install and exercise the gem in a bare container
        if: matrix.docker_platform != ''
        run: |
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v "$PWD/pkg:/pkg:ro" \
            -v "$PWD/spec/fixtures:/fixtures:ro" \
            -v "$PWD/.github/scripts/smoke_test.sh:/smoke_test.sh:ro" \
            ruby:3.3-slim /smoke_test.sh

      - name: Install and exercise the gem on the runner
        if: matrix.docker_platform == ''
        shell: bash
        env:
          PKG_DIR: ${{ github.workspace }}/pkg
          FIXTURES_DIR: ${{ github.workspace }}/spec/fixtures
        run: |
          export GEM_HOME="$RUNNER_TEMP/smoke"
          export GEM_PATH="$GEM_HOME"
          bash .github/scripts/smoke_test.sh

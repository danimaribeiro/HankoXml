name: Cross-compile

# Builds the precompiled Linux platform gems: the vendored libxml2 + xmlsec1
# static build (HANKO_XML_VENDOR=1) inside rake-compiler-dock, one platform per
# job. Nothing here publishes -- release.yml owns that. This workflow exists to
# prove the cross build works and to hand back installable .gem artifacts.
#
# Linux only so far. macOS is no longer blocked -- vendoring OpenSSL removed the
# absolute-Homebrew-path problem that held it back -- it simply has not been
# wired up yet. Windows remains a much larger toolchain lift. See VENDORING.md.

on:
  # Pull requests only, plus manual runs. Deliberately not `push` as well: a
  # branch with an open PR would otherwise build every platform twice per
  # commit, and each build compiles libxml2 and xmlsec1 from source for four
  # Ruby ABIs.
  pull_request:
  workflow_dispatch:

jobs:
  cross-gem:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          # Native inside the x86_64 dock container -- no C cross-compilation.
          - x86_64-linux
          # Genuinely cross-compiled. Unblocked once OpenSSL was vendored: its
          # failure was never our build, it was that the container had no
          # OpenSSL for the target.
          - aarch64-linux

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby & Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cargo-cache: true
          rubygems: latest

      - name: Build the platform gem
        uses: oxidize-rb/actions/cross-gem@v1
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: '3.1,3.2,3.3,3.4'
      - uses: actions/upload-artifact@v7
        with:
          name: gem-${{ matrix.platform }}
          path: pkg/*.gem
          if-no-files-found: error

  # Proves the precompiled gem installs and runs with no libxmlsec1-dev,
  # libxml2-dev, pkg-config, libclang or Rust toolchain present. That is the
  # entire point of shipping it, so it is the real acceptance test.
  smoke-test:
    name: install ${{ matrix.platform }} on a bare container
    needs: cross-gem
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-linux
            docker_platform: linux/amd64
          - platform: aarch64-linux
            docker_platform: linux/arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: gem-${{ matrix.platform }}
          path: pkg

      # GitHub's hosted arm64 runners are public-repo only, so aarch64 is
      # verified under emulation instead. Slower, but it genuinely executes
      # aarch64 code rather than merely inspecting the binary.
      - name: Set up QEMU
        if: matrix.platform == 'aarch64-linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install and exercise the gem with no build toolchain present
        run: |
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v "$PWD/pkg:/pkg:ro" \
            -v "$PWD/spec/fixtures:/fixtures:ro" \
            -v "$PWD/.github/scripts/smoke_test.sh:/smoke_test.sh:ro" \
            ruby:3.3-slim /smoke_test.sh

name: Cross-compile

# Builds the precompiled Linux platform gems: the vendored libxml2 + xmlsec1
# static build (HANKO_XML_VENDOR=1) inside rake-compiler-dock, one platform per
# job. Nothing here publishes -- release.yml owns that. This workflow exists to
# prove the cross build works and to hand back installable .gem artifacts.
#
# Linux only for now. macOS is blocked on the OpenSSL question in VENDORING.md
# (no system libcrypto, so the build bakes in an absolute Homebrew path) and
# Windows has that plus a much larger toolchain lift.

on:
  # Pull requests only, plus manual runs. Deliberately not `push` as well: a
  # branch with an open PR would otherwise build every platform twice per
  # commit, and each build compiles libxml2 and xmlsec1 from source for four
  # Ruby ABIs.
  pull_request:
  workflow_dispatch:
    inputs:
      include_aarch64:
        description: 'Also build aarch64-linux (known-blocked; see VENDORING.md)'
        type: boolean
        default: false

jobs:
  # aarch64-linux is kept but held back rather than deleted. The vendored build
  # cross-compiles both libraries for it correctly; what is missing is in the
  # build environment: the rb-sys-dock image carries no aarch64 OpenSSL, so
  # xmlsec1's build finds the host's arch-independent /usr/include/openssl and
  # then no aarch64 opensslconf.h behind it. Unblocking it means provisioning
  # libssl-dev:arm64 inside the container (which needs a pre-script -- no
  # released oxidize-rb/actions tag implements one, so the workflow would have
  # to call rb-sys-dock directly) or vendoring OpenSSL for cross-compiled
  # targets. VENDORING.md has the analysis and the three options.
  #
  # Until then it stays out of ordinary PR runs, so a known-blocked platform
  # does not mask a regression in a working one. Two ways to exercise it:
  # run this workflow manually with `include_aarch64`, or push to a branch
  # named aarch64*.
  platforms:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - id: pick
        run: |
          if [ "${{ inputs.include_aarch64 }}" = "true" ] || \
             [ "${{ startsWith(github.head_ref || github.ref_name, 'aarch64') }}" = "true" ]; then
            echo 'list=["x86_64-linux","aarch64-linux"]' >> "$GITHUB_OUTPUT"
          else
            echo 'list=["x86_64-linux"]' >> "$GITHUB_OUTPUT"
          fi
      - run: echo "Building ${{ steps.pick.outputs.list }}"

  cross-gem:
    name: ${{ matrix.platform }}
    needs: platforms
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Native inside the x86_64 dock container -- no C cross-compilation.
        # aarch64-linux joins this list only when opted into; see above.
        platform: ${{ fromJSON(needs.platforms.outputs.list) }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby & Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cargo-cache: true
          rubygems: latest

      - name: Build the platform gem
        uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: '3.1,3.2,3.3,3.4'
      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: pkg/*.gem
          if-no-files-found: error

  # Proves the precompiled gem installs and runs with no libxmlsec1-dev,
  # libxml2-dev, pkg-config, libclang or Rust toolchain present. That is the
  # entire point of shipping it, so it is the real acceptance test.
  smoke-test:
    name: install ${{ matrix.platform }} on a bare container
    needs: cross-gem
    # x86_64 is the only platform whose gem is smoke-tested today, and an
    # opted-in aarch64 failure must not suppress it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux
    container: ruby:3.3-slim
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: pkg

      - name: Install the precompiled gem with no build dependencies
        run: |
          set -eux
          ls -la pkg
          gem install --no-document --local pkg/*.gem
          ruby -e '
            require "hanko_xml"
            puts "loaded hanko_xml #{HankoXml::VERSION}"
            versions = HankoXml::NativeVersion.build_versions
            puts "vendored: #{versions.inspect}"
            raise "expected the pinned vendored libxml2" unless versions[:libxml2] == "2.14.6"
            raise "expected the pinned vendored xmlsec1" unless versions[:xmlsec] == "1.3.12"
            raise "version guard failed" unless HankoXml::NativeVersion.check! == :ok
            puts "OK"
          '

      - name: Confirm no libxml2 or xmlsec symbols are exported
        run: |
          set -eux
          apt-get update && apt-get install -y --no-install-recommends binutils
          so=$(ruby -e 'print Gem.find_files("hanko_xml/hanko_xml.so").first')
          echo "artifact: $so"
          leaked=$(nm -D --defined-only "$so" | awk '{print $3}' | grep -cE '^(xml|xmlSec)' || true)
          echo "leaked xml*/xmlSec* exports: $leaked"
          test "$leaked" -eq 0

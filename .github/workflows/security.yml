name: Security

# Automated security gates for the Ruby gem + Rust extension:
#   - cargo-deny: Rust crate advisories, licenses, and source policy
#   - clippy -D warnings: catches footguns in the FFI-heavy extension
#   - bundler-audit: known advisories in the Gemfile.lock graph
#
# Complements Dependabot (upgrade PRs) and vendored-deps.yml (libxml2/xmlsec1
# CVE tripwire). Domain checks for XSW / trust policy live in RSpec — add a
# dedicated job here when spec/security/ exists (see SIGNING_TEST_COVERAGE.md).

on:
  # No push trigger: main only moves through PRs, which ran this. The weekly
  # schedule catches advisories published after a merge.
  # Pull requests run this through ci.yml, only when the Rust extension or the
  # dependency manifests change.
  workflow_call:
  schedule:
    # Mondays, 06:30 UTC — shortly after vendored-deps, so advisory noise
    # from the same weekly window stays in one place.
    - cron: '30 6 * * 1'
  workflow_dispatch:

# A literal group, not ${{ github.workflow }}: when ci.yml or release.yml calls
# this file, github.workflow is the caller's name, and the suites it runs in
# parallel would share one group and cancel each other.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Split so a license/source policy failure is distinct from a new CVE.
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}
          manifest-path: ./Cargo.toml

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build.rs runs bindgen against libxmlsec1 headers, same as main.yml.
      - name: Install libxmlsec1
        run: sudo apt-get update && sudo apt-get install -y libxmlsec1-dev libxml2-dev pkg-config libclang-dev

      - name: Set up Ruby & Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          ruby-version: '3.4'
          rust-version: stable
          bundler-cache: false
          cargo-cache: true

      - name: Install clippy
        run: rustup component add clippy

      - name: cargo clippy -D warnings
        run: cargo clippy -p hanko_xml --all-targets -- -D warnings

  bundler-audit:
    name: bundler-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Update ruby-advisory-db and audit
        run: |
          bundle exec bundle-audit update
          bundle exec bundle-audit check

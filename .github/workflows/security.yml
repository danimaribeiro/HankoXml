name: Security

# Automated security gates for the Ruby gem + Rust extension:
#   - cargo-deny: Rust crate advisories, licenses, and source policy
#   - clippy -D warnings: catches footguns in the FFI-heavy extension
#   - bundler-audit: known advisories in the Gemfile.lock graph
#
# Complements Dependabot (upgrade PRs) and vendored-deps.yml (libxml2/xmlsec1
# CVE tripwire). Domain checks for XSW / trust policy live in RSpec — add a
# dedicated job here when spec/security/ exists (see SIGNING_TEST_COVERAGE.md).

on:
  # CI-PAUSED: automatic triggers are off to save Actions budget; run tests
  # locally before merging. Re-enable by uncommenting the CI-PAUSED lines.
  # CI-PAUSED push:
  # CI-PAUSED   branches:
  # CI-PAUSED     - main
  # CI-PAUSED pull_request:
  # CI-PAUSED schedule:
  # CI-PAUSED   # Mondays, 06:30 UTC — shortly after vendored-deps, so advisory noise
  # CI-PAUSED   # from the same weekly window stays in one place.
  # CI-PAUSED   - cron: '30 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Split so a license/source policy failure is distinct from a new CVE.
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}
          manifest-path: ./Cargo.toml

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build.rs runs bindgen against libxmlsec1 headers, same as main.yml.
      - name: Install libxmlsec1
        run: sudo apt-get update && sudo apt-get install -y libxmlsec1-dev libxml2-dev pkg-config libclang-dev

      - name: Set up Ruby & Rust
        uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        with:
          ruby-version: '3.4'
          rust-version: stable
          bundler-cache: false
          cargo-cache: true

      - name: Install clippy
        run: rustup component add clippy

      - name: cargo clippy -D warnings
        run: cargo clippy -p hanko_xml --all-targets -- -D warnings

  bundler-audit:
    name: bundler-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ruby/setup-ruby@984c0c890880bbf811283d6f09c4607c62d210a4 # v1.323.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Update ruby-advisory-db and audit
        run: |
          bundle exec bundle-audit update
          bundle exec bundle-audit check

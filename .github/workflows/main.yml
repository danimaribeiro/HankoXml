name: Ruby

on:
  # CI-PAUSED: automatic triggers are off to save Actions budget; run tests
  # locally before merging. Re-enable by uncommenting the CI-PAUSED lines.
  workflow_dispatch:
  # CI-PAUSED push:
  # CI-PAUSED   branches:
  # CI-PAUSED     - main

  # CI-PAUSED pull_request:

  # Lets the release workflow gate a tag on exactly the same matrix that
  # guards main, rather than keeping a second copy of it in sync by hand.
  workflow_call:

# Read-only GITHUB_TOKEN unless a job asks for more (S-19). When called from
# release.yml, the caller's permissions cap these anyway.
permissions:
  contents: read

# Superseded runs are pointless: only the tip commit's result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ruby:
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
        include:
          # One macOS job, not four. GitHub bills macOS at roughly 10x Linux,
          # and the macOS-specific code CI protects -- build.rs's Homebrew
          # keg-only probing and its absolute-path libxml2 linking -- does not
          # vary by Ruby version. Ruby-version risk (magnus, rb-sys, ABI drift)
          # is platform-independent and already covered four times on Linux, so
          # the other three macOS jobs were paying 10x to re-test that.
          #
          # 3.4 rather than the floor: newest Ruby on newest macOS is where
          # toolchain drift surfaces first, and required_ruby_version's 3.1
          # floor is exercised on Linux.
          - os: macos-latest
            ruby: '3.4'

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # libclang is not optional: ext/hanko_xml/build.rs runs bindgen against the
    # xmlsec1 headers on every build. The GitHub runners happen to ship clang
    # already, but naming it here keeps the requirement visible to anyone
    # reproducing the build elsewhere.
    - name: Install libxmlsec1 (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libxmlsec1-dev libxml2-dev pkg-config libclang-dev

    - name: Install libxmlsec1 (macOS)
      if: runner.os == 'macOS'
      run: brew install libxmlsec1 libxml2 pkg-config

    - name: Set up Ruby & Rust
      uses: oxidize-rb/actions/setup-ruby-and-rust@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
        cargo-cache: true
        # spec.required_rubygems_version is >= 3.3.11 (the first RubyGems that
        # can build a Cargo.toml extension); older Ruby lines ship less than that.
        rubygems: latest

    - name: Run the default task
      run: bundle exec rake

    - name: Report the libxmlsec1 the extension was built against
      run: bundle exec ruby -Ilib -e 'require "hanko_xml"; p HankoXml::NativeVersion.build_versions'

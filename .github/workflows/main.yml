name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

  # Lets the release workflow gate a tag on exactly the same matrix that
  # guards main, rather than keeping a second copy of it in sync by hand.
  workflow_call:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        ruby:
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'

    steps:
    - uses: actions/checkout@v7

    # libclang is not optional: ext/hanko_xml/build.rs runs bindgen against the
    # xmlsec1 headers on every build. The GitHub runners happen to ship clang
    # already, but naming it here keeps the requirement visible to anyone
    # reproducing the build elsewhere.
    - name: Install libxmlsec1 (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libxmlsec1-dev libxml2-dev pkg-config libclang-dev

    - name: Install libxmlsec1 (macOS)
      if: runner.os == 'macOS'
      run: brew install libxmlsec1 libxml2 pkg-config

    - name: Set up Ruby & Rust
      uses: oxidize-rb/actions/setup-ruby-and-rust@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
        cargo-cache: true
        # spec.required_rubygems_version is >= 3.3.11 (the first RubyGems that
        # can build a Cargo.toml extension); older Ruby lines ship less than that.
        rubygems: latest

    - name: Run the default task
      run: bundle exec rake

    - name: Report the libxmlsec1 the extension was built against
      run: bundle exec ruby -Ilib -e 'require "hanko_xml"; p HankoXml::NativeVersion.build_versions'

name: CodeQL

# Static analysis (#181, Scorecard's SAST check) of the Ruby layer, the Rust
# extension and the workflows themselves. All three are analysed from source
# (build-mode none), so this job needs neither libxmlsec1 nor a compiled
# extension. Findings go to the repository's code scanning alerts.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 07:30 UTC, after security.yml and scorecard.yml.
    - cron: '30 7 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, ruby, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

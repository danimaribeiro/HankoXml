name: Scorecard

# OpenSSF Scorecard (#181): rates the repository's supply-chain practices
# (pinned actions, token permissions, branch protection, fuzzing, signed
# releases, ...), publishes the result for the README badge, and uploads the
# findings to code scanning. With publish_results the job may only use the
# actions below, and the workflow must not set top-level env or defaults.

on:
  # Runs on main only: branch protection checks need the default branch, and
  # the published result is what the badge shows.
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    # Mondays, 07:00 UTC, after security.yml.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF file to code scanning.
      security-events: write
      # Publish the result to the Scorecard API, which the badge reads.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the SARIF file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
